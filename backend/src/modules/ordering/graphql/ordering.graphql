enum OrderStatus {
    PENDING_APPROVAL
    APPROVED
    DISPATCHED
    CANCELLED
}

"""
Línea de una orden tal y como quedó en la proyección.
`unitPrice` es el precio congelado al momento de comprar: si el catálogo
sube de precio mañana, esta orden no cambia.
"""
type OrderItem {
    medicationId: UUID!
    name: String!
    presentation: String!
    quantity: Int!
    unitPrice: Money!
    lineTotal: Money!
}

"""
Vista de una orden. Se sirve desde `read_model.order_projections`, NO desde
las tablas transaccionales: es el modelo de lectura del patrón CQRS.
"""
type Order {
    id: UUID!
    status: OrderStatus!
    total: Money!
    itemCount: Int!
    items: [OrderItem!]!

    "Hay fórmulas médicas esperando revisión farmacéutica."
    pendingPrescriptions: Boolean!

    placedAt: DateTime!

    """
    Momento en que se reconstruyó esta proyección. Comparado con `placedAt`
    mide el desfase de la consistencia eventual.
    """
    projectedAt: DateTime!
}

type OrderPage {
    items: [Order!]!
    totalCount: Int!
    hasMore: Boolean!
}

# ─────────── Entradas de los comandos ───────────

input OrderItemInput {
    medicationId: UUID!
    quantity: Int!
}

"Soporte de fórmula médica para un medicamento de venta bajo receta."
input PrescriptionInput {
    medicationId: UUID!
    doctorName: String!
    doctorLicense: String!
    issuedAt: String!
    documentUrl: String
}

input PlaceOrderInput {
    items: [OrderItemInput!]!
    prescriptions: [PrescriptionInput!] = []
}

# ─────────── Payloads ───────────

"""
Respuesta del comando de compra.

`order` puede venir null aunque la orden se haya creado: la proyección es
eventualmente consistente. `orderId` y `status` salen del modelo de escritura
y están disponibles de inmediato, así que el cliente siempre tiene con qué
pintar un estado optimista.
"""
type PlaceOrderPayload {
    orderId: UUID
    status: OrderStatus
    total: Money
    order: Order
    errors: [UserError!]!
}

type OrderStatusPayload {
    orderId: UUID
    status: OrderStatus
    order: Order
    errors: [UserError!]!
}

# ─────────── Operaciones ───────────

extend type Query {
    "Órdenes del paciente autenticado, desde el modelo de lectura."
    myOrders(limit: Int = 20, offset: Int = 0): OrderPage!

    "Proyección de una orden. Null si no existe o no pertenece al paciente."
    order(id: UUID!): Order
}

extend type Mutation {
    "Comando de compra: valida recetas, reserva stock y crea la orden."
    placeOrder(input: PlaceOrderInput!): PlaceOrderPayload!

    "Revisión farmacéutica: valida las fórmulas y aprueba la orden."
    validatePrescription(orderId: UUID!): OrderStatusPayload!

    "Marca la orden como despachada."
    dispatchOrder(orderId: UUID!): OrderStatusPayload!

    "Cancela la orden y devuelve el inventario reservado."
    cancelOrder(orderId: UUID!): OrderStatusPayload!
}

extend type Subscription {
    "Emite la proyección actualizada cada vez que la orden cambia de estado."
    orderStatusChanged(orderId: UUID!): Order!
}
